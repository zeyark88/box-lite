name: BUILD APK

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find . -name '*.apk' ! -name '*unsigned*' -exec cp {} "$GITHUB_WORKSPACE/apk/" \;

      - name: Generate SHA256SUMS
        run: cd "$GITHUB_WORKSPACE/apk" && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box
          path: ${{ github.workspace }}/apk/*

      # 说明：签名需在本地用你私有的 keystore 完成（见 docs/DISTRIBUTION.md），
      #       CI 仅产出构建产物与校验和，避免密钥进仓库。