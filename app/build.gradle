apply plugin: 'com.android.application'

android {
    // 保持低版本：Android 4.1 (API 16) 起可用，目标是 4.4+ / 老盒子
    compileSdkVersion 30

    defaultConfig {
        // TODO(发行版): 修改为你的 applicationId / 名称 / 版本号，见 docs/DISTRIBUTION.md
        applicationId 'tv.of.eu.box.daily'
        minSdkVersion 16
        targetSdkVersion 26
        versionCode 7
        versionName '1.0.6'
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        // 安全发行版：keystore 与密码严禁提交仓库。
        // 在 local.properties 里配置你自己的签名，见 docs/DISTRIBUTION.md
        release {
            def sp = new Properties()
            def lf = rootProject.file('local.properties')
            if (lf.exists()) sp.load(new FileInputStream(lf))
            storeFile sp.getProperty('box.storeFile') ? file(sp.getProperty('box.storeFile')) : null
            storePassword sp.getProperty('box.storePassword')
            keyAlias sp.getProperty('box.keyAlias')
            keyPassword sp.getProperty('box.keyPassword')
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                output.outputFileName = "box-v${defaultConfig.versionName}.apk"
                output.getPackageApplication().outputDirectory =
                        new File(project.rootDir.absolutePath + "/release")
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
            ndk { abiFilters 'armeabi-v7a' }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 关闭 R8 混淆/裁剪：proguard-rules.pro 为空，R8 会删掉 Room/Gson/quickjs 等反射用类，
            // 造成 release 启动即崩（debug 正常）。为保证可运行，release 暂不开启 minify。
            minifyEnabled false
            // 仅当本地配置了签名时才签名，否则输出未签名包（不可直接安装）
            signingConfig signingConfigs.release
            // 原生库(p2p/quickjs/ijk/player)仅预编译了 armeabi-v7a，必须限定该 ABI，
            // 否则 arm64/x86 设备缺 .so 启动即崩（arm64 会以 32 位兼容运行 armeabi-v7a）
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    // 禁用 ABI 分割（保持单包）
    splits {
        abi { enable false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    dexOptions {
        javaMaxHeapSize "4g"
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=48000'
        additionalParameters += '--minimal-main-dex'
    }
}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    implementation 'com.github.alidili:FlowLayout:v1.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:2.8.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') { exclude group: 'xmlpull', module: 'xmlpull' }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")

    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'org.brotli:dec:0.1.2'
}